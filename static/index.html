<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Utilities</title>
<style>
:root{--bg:#09111f;--bg2:#0d1729;--glass:rgba(224,233,246,.08);--glass2:rgba(169,201,236,.12);--stroke:rgba(224,233,246,.18);--text:#eaf2ff;--muted:#9eb0cc;--a:#87acef;--b:#5c75d1;--c:#c4dcf3;--ok:#8ff0cf;--warn:#ffd37d;--danger:#ff91aa;--r:24px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(800px 500px at 10% 0%,rgba(92,117,209,.28),transparent 65%),radial-gradient(800px 600px at 100% 100%,rgba(135,172,239,.2),transparent 60%),linear-gradient(135deg,#07101d,#101b30 56%,#0a1120);color:var(--text)}body:before,body:after{content:"";position:fixed;inset:auto;pointer-events:none;filter:blur(40px);border-radius:999px;opacity:.45}.app{min-height:100vh;padding:22px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}.sidebar,.main-shell,.card{background:linear-gradient(145deg,rgba(224,233,246,.12),rgba(135,172,239,.055));border:1px solid var(--stroke);box-shadow:0 30px 90px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}.sidebar{border-radius:30px;padding:20px;display:flex;flex-direction:column;min-height:calc(100vh - 44px);position:sticky;top:22px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#e0e9f6,#87acef 65%,#5c75d1);color:#12203a;font-weight:900;box-shadow:0 10px 30px rgba(135,172,239,.35)}.brand h1{font-size:18px;margin:0}.brand span{display:block;font-size:11px;color:var(--muted);margin-top:2px}.nav{display:grid;gap:7px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;border-radius:16px;padding:12px 12px;font-size:13px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s}.nav button:hover{background:rgba(196,220,243,.08);color:var(--text)}.nav button.active{background:linear-gradient(135deg,rgba(135,172,239,.22),rgba(92,117,209,.12));border-color:rgba(196,220,243,.2);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.16)}.ico{width:20px;height:20px;display:grid;place-items:center}.sidebar-foot{margin-top:auto;padding:14px 8px;color:var(--muted);font-size:11px}.pulse{display:flex;align-items:center;gap:7px;margin-bottom:4px;color:var(--text)}.dot{width:7px;height:7px;border-radius:999px;background:var(--ok);box-shadow:0 0 14px var(--ok)}
.main-shell{min-width:0;border-radius:32px;overflow:hidden}.topbar{padding:26px 26px 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;border-bottom:1px solid rgba(224,233,246,.08)}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a9c9ec;font-weight:700}.title{font-size:38px;line-height:1.05;margin:7px 0 0;font-weight:780;letter-spacing:-.03em}.sub{color:var(--muted);font-size:13px;margin-top:7px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn,.input{border:1px solid var(--stroke);background:rgba(224,233,246,.07);color:var(--text);border-radius:14px;padding:10px 14px;font:inherit}.btn{cursor:pointer}.btn.primary{background:linear-gradient(135deg,rgba(135,172,239,.38),rgba(92,117,209,.42));box-shadow:0 10px 24px rgba(92,117,209,.18)}.content{padding:22px;min-width:0}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.card{border-radius:var(--r);padding:18px;min-width:0;overflow:hidden}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.card-title{font-size:16px;font-weight:730}.pill{padding:6px 9px;border-radius:999px;background:rgba(224,233,246,.08);border:1px solid rgba(224,233,246,.12);font-size:10px;color:#c9d7ec;white-space:nowrap}.hero-metrics{display:grid;grid-template-columns:1.4fr repeat(4,minmax(110px,1fr));gap:10px}.metric{min-width:0;padding:16px;border-radius:19px;background:linear-gradient(145deg,rgba(224,233,246,.11),rgba(135,172,239,.045));border:1px solid rgba(224,233,246,.13)}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:30px;font-weight:780;margin-top:5px;letter-spacing:-.02em}.metric .small{margin-top:4px;font-size:11px;color:var(--muted)}.bar{height:7px;border-radius:999px;background:rgba(224,233,246,.08);overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#c4dcf3,#87acef,#5c75d1)}.spark{height:80px;margin-top:14px;border-radius:18px;background:rgba(5,10,18,.16);overflow:hidden}.spark canvas{width:100%;height:100%}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(80px,.7fr) minmax(80px,.6fr);gap:12px;align-items:center;padding:11px 12px;border-radius:15px;background:rgba(224,233,246,.055);border:1px solid rgba(224,233,246,.08);min-width:0}.row > *{min-width:0}.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted)}.tiny{font-size:11px}.big{font-size:28px;font-weight:780}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kv .item{padding:12px;border-radius:16px;background:rgba(224,233,246,.055);border:1px solid rgba(224,233,246,.08);min-width:0}.k{font-size:11px;color:var(--muted)}.v{font-size:14px;margin-top:4px;overflow-wrap:anywhere}.table{display:grid;gap:7px;max-height:560px;overflow:auto;padding-right:3px}.table::-webkit-scrollbar{width:7px}.table::-webkit-scrollbar-thumb{background:rgba(196,220,243,.2);border-radius:999px}.thead{display:grid;grid-template-columns:70px minmax(160px,1.5fr) 90px 80px 80px 110px;gap:12px;padding:7px 10px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.trow{display:grid;grid-template-columns:70px minmax(160px,1.5fr) 90px 80px 80px 110px;gap:12px;align-items:center;padding:11px 10px;border-radius:14px;background:rgba(224,233,246,.045);border:1px solid rgba(224,233,246,.07);font-size:12px;min-width:0}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.input{flex:1;min-width:180px;outline:none}.detail{font-size:11px;color:var(--muted);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:230px;overflow:auto}.device{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:17px;background:rgba(224,233,246,.055);border:1px solid rgba(224,233,246,.08)}.avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,rgba(224,233,246,.2),rgba(135,172,239,.12));display:grid;place-items:center}.actions-sm{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.btn-sm{border:1px solid rgba(224,233,246,.14);background:rgba(224,233,246,.07);color:var(--text);border-radius:11px;padding:7px 9px;font-size:11px;cursor:pointer}.btn-sm.danger{color:#ffb1bf}.empty{text-align:center;color:var(--muted);padding:25px;border:1px dashed rgba(224,233,246,.14);border-radius:16px}.footer-note{margin-top:14px;color:var(--muted);font-size:11px;line-height:1.45}.toast{position:fixed;right:22px;bottom:22px;max-width:420px;padding:13px 15px;border-radius:15px;background:rgba(11,18,31,.88);border:1px solid rgba(224,233,246,.18);backdrop-filter:blur(18px);display:none;box-shadow:0 20px 50px rgba(0,0,0,.35)}.toast.show{display:block}
@media(max-width:1100px){.app{grid-template-columns:200px minmax(0,1fr)}.hero-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}}
@media(max-width:780px){.app{display:block;padding:12px}.sidebar{position:relative;top:0;min-height:auto;margin-bottom:12px}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar-foot{display:none}.main-shell{border-radius:24px}.topbar{padding:18px;align-items:flex-start}.title{font-size:31px}.content{padding:14px}.hero-metrics{grid-template-columns:1fr}.grid2,.kv{grid-template-columns:1fr}.thead{display:none}.trow{grid-template-columns:65px minmax(0,1fr) 75px;gap:8px}.trow > :nth-child(3),.trow > :nth-child(4),.trow > :nth-child(5){display:none}.device{grid-template-columns:auto minmax(0,1fr)}.device .actions-sm{grid-column:2;justify-content:flex-start}.row{grid-template-columns:1fr}.topbar .actions{margin-top:8px}}
</style></head><body><div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">U</div><div><h1>Utilities</h1><span>Unified Linux control studio</span></div></div><nav class="nav" id="nav"></nav><div class="sidebar-foot"><div class="pulse"><span class="dot"></span><b>Local system control</b></div><div id="clock"></div></div></aside>
<main class="main-shell"><header class="topbar"><div><div class="eyebrow">Unified Linux toolkit</div><div class="title" id="title">Monitor House</div><div class="sub" id="sub">Live system observability</div></div><div class="actions"><button class="btn" id="refresh">Refresh</button><button class="btn primary" id="quick">Quick actions</button></div></header><section class="content" id="content"></section></main></div><div class="toast" id="toast"></div>
<script>
const H={monitor:{label:'Monitor House',icon:'◈',sub:'Live system observability'},net:{label:'Net House',icon:'⌁',sub:'Interfaces, traffic and sockets'},power:{label:'Power House',icon:'◌',sub:'Battery intelligence and power state'},thermal:{label:'Thermal House',icon:'♨',sub:'Thermal field and fan control'},device:{label:'Device House',icon:'▣',sub:'Bluetooth and USB device center'},disk:{label:'Disk House',icon:'▤',sub:'Filesystems and storage health'},apps:{label:'App House',icon:'▦',sub:'Installed packages and system software'},files:{label:'File House',icon:'□',sub:'Safe filesystem utilities'},privacy:{label:'Privacy House',icon:'◇',sub:'Security posture and sensors'},backup:{label:'Backup House',icon:'↥',sub:'Recovery plans and local backups'}};
let page='monitor',S={telemetry:null,battery:null,processes:[],network:null,disks:[],thermal:null,bt:null,usb:[],packages:[],privacy:null,system:null};
const $=q=>document.querySelector(q), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(u){let r=await fetch(u,{cache:'no-store'});return r.json()} async function post(u,b){let r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json()}
function fmtB(n){if(n==null)return '—';const u=['B','KB','MB','GB','TB'];let i=0,x=n;while(x>=1024&&i<u.length-1){x/=1024;i++}return x.toFixed(i?1:0)+' '+u[i]}
function fmtTime(s){if(!s)return '—';let h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+'h '+m+'m'}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2800)}
function nav(){let n=$('#nav');n.innerHTML=Object.entries(H).map(([k,v])=>`<button class="${k===page?'active':''}" data-page="${k}"><span class="ico">${v.icon}</span><span>${v.label}</span></button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.page))}
function header(){let h=H[page];$('#title').textContent=h.label;$('#sub').textContent=h.sub;nav()}
function shell(html){$('#content').innerHTML=html}
function canvas(id,vals){requestAnimationFrame(()=>{let c=document.getElementById(id);if(!c)return;let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);x.clearRect(0,0,r.width,r.height);if(!vals.length)return;let max=Math.max(...vals,100),min=Math.min(...vals,0),w=r.width,h=r.height;x.strokeStyle='#a9c9ec';x.lineWidth=2;x.beginPath();vals.forEach((v,i)=>{let px=i*(w/(vals.length-1||1)),py=h-8-((v-min)/(max-min||1))*(h-16);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.globalAlpha=.13;x.fillStyle='#87acef';x.lineTo(w,h);x.lineTo(0,h);x.closePath();x.fill()})}
let hist=[];function metricCards(){let t=S.telemetry||{};hist.push(Number(t.cpu||0));if(hist.length>32)hist.shift();let b=S.battery||{};return `<div class="card span-12"><div class="card-head"><div><div class="eyebrow">System pulse</div><div class="card-title" style="margin-top:6px">${esc((S.system||{}).cpu||'Linux')} · ${t.cpu??0}% CPU</div></div><span class="pill">${esc((S.system||{}).cores||'—')} cores · ${esc((S.system||{}).threads||'—')} threads</span></div><div class="hero-metrics"><div class="metric"><div class="label">CPU</div><div class="value">${t.cpu??0}%</div><div class="small">Load ${(t.load||[]).join(' / ')||'—'}</div></div><div class="metric"><div class="label">Memory</div><div class="value">${t.memory??0}%</div><div class="small">${t.memory_used_gb??0} / ${t.memory_total_gb??0} GB</div><div class="bar"><i style="width:${t.memory||0}%"></i></div></div><div class="metric"><div class="label">Disk</div><div class="value">${t.disk??0}%</div><div class="small">${t.disk_used_gb??0} / ${t.disk_total_gb??0} GB</div><div class="bar"><i style="width:${t.disk||0}%"></i></div></div><div class="metric"><div class="label">Network ↓</div><div class="value">${fmtB(histNetRecvRate||0)}/s</div><div class="small">Cumulative receive</div></div><div class="metric"><div class="label">Battery</div><div class="value">${b.percent??'—'}%</div><div class="small">${esc(b.state||'Unavailable')}</div><div class="bar"><i style="width:${b.percent||0}%"></i></div></div></div><div class="spark"><canvas id="cpuChart"></canvas></div></div>`}
let histNetRecvRate=0,lastRecv=null,lastNetAt=Date.now();function calcNet(t){let now=Date.now();if(lastRecv!==null){histNetRecvRate=Math.max(0,(t.net_recv-lastRecv)/((now-lastNetAt)/1000))}lastRecv=t.net_recv;lastNetAt=now}
function monitor(){let p=(S.processes||[]).slice(0,10);shell(`<div class="grid">${metricCards()}<div class="card span-8"><div class="card-head"><div class="card-title">Live processes</div><span class="pill">${S.processes.length} sampled</span></div><div class="toolbar"><input class="input" id="pq" placeholder="Search process…" oninput="renderProcTable(this.value)"><button class="btn" onclick="loadMonitor()">Refresh data</button></div><div id="procTable"></div></div><div class="card span-4"><div class="card-head"><div class="card-title">System snapshot</div><span class="pill">Live</span></div><div class="kv"><div class="item"><div class="k">OS</div><div class="v">${esc((S.system||{}).os||'—')}</div></div><div class="item"><div class="k">Kernel</div><div class="v">${esc((S.system||{}).kernel||'—')}</div></div><div class="item"><div class="k">RAM</div><div class="v">${S.system?.ram_gb||'—'} GB</div></div><div class="item"><div class="k">Uptime</div><div class="v">${fmtTime(S.system?.uptime)}</div></div></div><div class="footer-note">Process control is handled by the Linux backend. Protected processes may require elevated privileges.</div></div></div>`);renderProcTable('');canvas('cpuChart',hist)}
function renderProcTable(q){let rows=(S.processes||[]).filter(p=>(p.name+' '+p.user).toLowerCase().includes((q||'').toLowerCase())).slice(0,120);$('#procTable').innerHTML=`<div class="table"><div class="thead"><div>PID</div><div>Process</div><div>State</div><div>CPU</div><div>RAM</div><div>Actions</div></div>${rows.map(p=>`<div class="trow"><div>${p.pid}</div><div class="truncate"><b>${esc(p.name)}</b><div class="tiny muted truncate">${esc(p.user)}</div></div><div class="tiny">${esc(p.status)}</div><div>${p.cpu}%</div><div>${p.memory}%</div><div class="actions-sm"><button class="btn-sm danger" onclick="procAction(${p.pid},'terminate')">Terminate</button><button class="btn-sm" onclick="procAction(${p.pid},'suspend')">Pause</button></div></div>`).join('')||'<div class="empty">No matching processes</div>'}</div>`}
async function procAction(pid,action){let r=await post('/api/process/action',{pid,action});toast(r.ok?`Process ${pid}: ${action}`:(r.error||'Action failed'));loadMonitor()}
function net(){let n=S.network||{};shell(`<div class="grid"><div class="card span-12"><div class="card-head"><div class="card-title">Network fabric</div><span class="pill">${esc(n.hostname||'Local host')}</span></div><div class="rows">${(n.interfaces||[]).map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="tiny muted">${x.mtu||0} MTU · ${(x.ips||[]).join(' · ')||'No address'}</div></div><div><span class="pill">${x.up?'Online':'Offline'}</span></div><div>${x.speed?x.speed+' Mbps':'—'}</div></div>`).join('')||'<div class="empty">No interfaces</div>'}</div></div><div class="card span-12"><div class="card-head"><div class="card-title">Active connections</div><span class="pill">${n.connections?.length||0} sockets sampled</span></div><div class="rows">${(n.connections||[]).slice(0,80).map(x=>`<div class="row"><div><b>${esc(x.laddr||'—')}</b><div class="tiny muted">PID ${x.pid??'—'}</div></div><div>${esc(x.status)}</div><div class="truncate">${esc(x.raddr||'—')}</div></div>`).join('')||'<div class="empty">No active connections</div>'}</div></div></div>`)}
function power(){let b=S.battery||{};shell(`<div class="grid"><div class="card span-7"><div class="card-head"><div class="card-title">Battery core</div><span class="pill">${esc(b.state||'Unavailable')}</span></div><div style="display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap"><div><div class="eyebrow">Current charge</div><div class="big" style="font-size:64px">${b.percent??'—'}%</div><div class="sub">${b.plugged?'External power connected':'On battery'}</div></div><div style="text-align:right"><div class="eyebrow">Health</div><div class="big">${b.health??'—'}%</div><div class="tiny muted">Degradation ${b.degradation??'—'}%</div></div></div><div class="bar"><i style="width:${b.percent||0}%"></i></div><div class="kv" style="margin-top:12px"><div class="item"><div class="k">Full charge capacity</div><div class="v">${b.full_wh!=null?b.full_wh.toFixed(2)+' Wh':'—'}</div></div><div class="item"><div class="k">Design capacity</div><div class="v">${b.design_wh!=null?b.design_wh.toFixed(2)+' Wh':'—'}</div></div><div class="item"><div class="k">Cycles</div><div class="v">${b.cycle_count??'—'}</div></div><div class="item"><div class="k">Voltage</div><div class="v">${b.voltage!=null?b.voltage+' V':'—'}</div></div></div></div><div class="card span-5"><div class="card-head"><div class="card-title">Power diagnostics</div><span class="pill">Linux battery interface</span></div><div class="stack"><div class="item"><div class="k">Power draw</div><div class="v">${b.power_w!=null?b.power_w+' W':'—'}</div></div><div class="item"><div class="k">Battery temperature</div><div class="v">${b.temperature!=null?b.temperature+' °C':'—'}</div></div><div class="item"><div class="k">Estimated time</div><div class="v">${fmtTime(b.seconds_left)}</div></div></div><div class="footer-note">Health is normalized from full-charge capacity ÷ design capacity and displayed to one decimal place everywhere in the suite.</div></div></div>`)}
function thermal(){let t=S.thermal||{};shell(`<div class="grid"><div class="card span-7"><div class="card-head"><div class="card-title">Thermal field</div><span class="pill">${t.zones?.length||0} sensors</span></div><div class="grid2">${(t.zones||[]).map(z=>`<div class="metric"><div class="label">${esc(z.type)}</div><div class="value">${z.c}°</div><div class="small">Thermal zone</div></div>`).join('')||'<div class="empty">No thermal zones exposed</div>'}</div></div><div class="card span-5"><div class="card-head"><div class="card-title">Fan control</div><span class="pill">Hardware dependent</span></div><div class="rows">${(t.fans||[]).map(f=>`<div class="device"><div class="avatar">♨</div><div><b>${esc(f.name)}</b><div class="tiny muted">${esc(f.sensor)}</div></div><div><b>${f.rpm} RPM</b></div></div>`).join('')||'<div class="empty">No fan RPM sensors exposed</div>'}</div>${(t.pwm||[]).map(p=>`<div class="metric" style="margin-top:10px"><div style="display:flex;justify-content:space-between"><div><div class="label">${esc(p.name)} · ${p.writable?'Writable':'Read-only'}</div><div class="small">Value ${p.value}/255</div></div>${p.writable?`<input type="range" min="0" max="255" value="${p.value}" style="width:45%" oninput="setFan('${esc(p.path)}',this.value)">`:''}</div></div>`).join('')}</div><div class="card span-12"><div class="card-title">Cooling note</div><div class="footer-note">Fan boost only writes to Linux hwmon PWM controls explicitly exposed as writable. Hardware/vendor firmware may ignore or restrict software fan control.</div></div></div>`)}
let fanTimer;async function setFan(path,v){clearTimeout(fanTimer);fanTimer=setTimeout(async()=>{let r=await post('/api/fan/boost',{path,value:Number(v)});if(!r.ok)toast(r.error||'Fan control unavailable')},120)}
function device(){let b=S.bt||{};shell(`<div class="grid"><div class="card span-7"><div class="card-head"><div class="card-title">Bluetooth</div><div class="actions"><button class="btn" onclick="bt('scan')">Scan</button><button class="btn" onclick="bt('power',${b.powered?'false':'true'})">${b.powered?'Power off':'Power on'}</button></div></div><div class="tiny muted" style="margin-bottom:12px">Adapter · ${esc(b.adapter||'Unavailable')}</div><div class="rows">${(b.devices||[]).map(d=>`<div class="device"><div class="avatar">◈</div><div class="truncate"><b>${esc(d.name)}</b><div class="tiny muted truncate">${d.mac} · ${d.connected?'Connected':'Paired'}${d.battery?' · '+esc(d.battery):''}</div></div><div class="actions-sm"><button class="btn-sm" onclick="bt('${d.mac}','${d.connected?'disconnect':'connect'}')">${d.connected?'Disconnect':'Connect'}</button><button class="btn-sm" onclick="renameBt('${d.mac}','${esc(d.name)}')">Rename</button></div></div>`).join('')||'<div class="empty">No paired devices found</div>'}</div></div><div class="card span-5"><div class="card-head"><div class="card-title">USB fabric</div><span class="pill">${S.usb.length} detected</span></div><div class="rows">${S.usb.slice(0,40).map(x=>`<div class="row" style="grid-template-columns:1fr"><div class="truncate">${esc(x.text)}</div></div>`).join('')||'<div class="empty">Install lsusb for USB inventory</div>'}</div></div></div>`)}
async function bt(action,value){let r=await post('/api/bluetooth/action',{action,value});toast(r.ok?'Bluetooth command sent':(r.error||r.out||'Bluetooth operation failed'));setTimeout(loadDevice,700)}async function renameBt(mac,current){let n=prompt('Bluetooth name',current);if(n) {let r=await post('/api/bluetooth/action',{action:'rename',mac,value:n});toast(r.ok?'Device renamed':(r.error||r.out||'Rename failed'));setTimeout(loadDevice,700)}}
function disk(){shell(`<div class="grid">${(S.disks||[]).map(d=>`<div class="card span-6"><div class="card-head"><div class="card-title truncate">${esc(d.mount)}</div><span class="pill">${esc(d.fstype||'filesystem')}</span></div><div class="big">${d.percent}%</div><div class="bar"><i style="width:${d.percent}%"></i></div><div class="tiny muted" style="margin-top:7px">${fmtB(d.used)} used · ${fmtB(d.free)} free · ${fmtB(d.total)} total</div><div class="kv" style="margin-top:10px"><div class="item"><div class="k">Device</div><div class="v truncate">${esc(d.device)}</div></div><div class="item"><div class="k">Free</div><div class="v">${fmtB(d.free)}</div></div></div></div>`).join('')||'<div class="empty span-12">No mounted filesystems</div>'}</div>`)}
function apps(){let q=window.appQ||'';let ps=(S.packages||[]).filter(x=>(x.name+' '+x.version).toLowerCase().includes(q.toLowerCase())).slice(0,260);shell(`<div class="grid"><div class="card span-12"><div class="card-head"><div class="card-title">App inventory</div><span class="pill">${S.packages.length} dpkg packages</span></div><div class="toolbar"><input class="input" placeholder="Search installed packages…" value="${esc(q)}" oninput="window.appQ=this.value;apps()"><button class="btn" onclick="loadApps()">Rescan</button></div><div class="rows">${ps.map(p=>`<div class="row" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto"><div class="truncate"><b>${esc(p.name)}</b></div><div class="truncate muted">${esc(p.version)}</div><div><button class="btn-sm danger" onclick="removePkg('${esc(p.name)}')">Remove</button></div></div>`).join('')||'<div class="empty">No package matches</div>'}</div><div class="footer-note">This inventory comes from dpkg, so packages installed from the terminal are included alongside packages installed by graphical tools.</div></div></div>`)}
async function removePkg(name){if(!confirm('Remove '+name+' using apt?'))return;let r=await post('/api/package/action',{name});toast(r.ok?'Package removal finished':'Removal failed: '+(r.error||r.out));loadApps()}
function files(){shell(`<div class="grid"><div class="card span-8"><div class="card-head"><div class="card-title">File House</div><span class="pill">Safe local utilities</span></div><div class="big">Filesystem cockpit</div><div class="sub">Use your desktop file manager for full file operations while Utilities provides quick system-aware entry points.</div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="openFolder('~')">Open Home</button><button class="btn" onclick="openFolder('~/Downloads')">Downloads</button><button class="btn" onclick="openFolder('~/Documents')">Documents</button><button class="btn" onclick="openFolder('~/Desktop')">Desktop</button></div></div><div class="card span-4"><div class="card-title">Root usage</div><div class="big" style="margin-top:10px">${S.telemetry?.disk??0}%</div><div class="bar"><i style="width:${S.telemetry?.disk||0}%"></i></div><div class="footer-note">${S.telemetry?.disk_used_gb??0} / ${S.telemetry?.disk_total_gb??0} GB on /</div></div></div>`)}async function openFolder(p){await post('/api/open-folder',{path:p});toast('Folder request sent')}
function privacy(){let p=S.privacy||{},fw=p.firewall||{};shell(`<div class="grid"><div class="card span-6"><div class="card-head"><div class="card-title">Firewall posture</div><span class="pill">${esc(fw.tool)}</span></div><div class="big">${esc(fw.status||'Unknown')}</div><div class="detail" style="margin-top:12px">${esc(fw.detail||'')}</div></div><div class="card span-6"><div class="card-head"><div class="card-title">Privacy surface</div></div><div class="kv"><div class="item"><div class="k">Secure Boot</div><div class="v">${esc(p.secure_boot||'Unknown')}</div></div><div class="item"><div class="k">Video devices</div><div class="v">${p.video_nodes?.length||0}</div></div><div class="item"><div class="k">Audio nodes</div><div class="v">${p.audio_nodes?.length||0}</div></div><div class="item"><div class="k">Policy</div><div class="v">OS-managed</div></div></div></div></div>`)}
function backup(){shell(`<div class="grid"><div class="card span-7"><div class="eyebrow">Backup House</div><div class="big" style="font-size:46px;margin-top:8px">Protect what matters.</div><div class="sub">A glass workspace for backup planning without silently modifying your filesystem.</div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="backupInfo()">Create backup plan</button><button class="btn" onclick="openFolder('~')">Open Home</button></div></div><div class="card span-5"><div class="card-title">Recommended layers</div><div class="rows" style="margin-top:12px"><div class="device"><div class="avatar">1</div><div><b>Daily files</b><div class="tiny muted">rsync or external SSD</div></div></div><div class="device"><div class="avatar">2</div><div><b>System snapshot</b><div class="tiny muted">Timeshift / Btrfs where available</div></div></div><div class="device"><div class="avatar">3</div><div><b>Off-device copy</b><div class="tiny muted">Second physical or cloud target</div></div></div></div></div></div>`)}function backupInfo(){toast('Keep at least one offline or off-device copy; configure the actual backup target in your desktop backup tool.')}
function show(k){page=k;header();loadPage()}
async function loadPage(){if(page==='monitor')return loadMonitor();if(page==='net'){S.network=await get('/api/network');net();return}if(page==='power'){S.battery=await get('/api/battery');power();return}if(page==='thermal'){S.thermal=await get('/api/thermal');thermal();return}if(page==='device')return loadDevice();if(page==='disk'){S.disks=await get('/api/disks');disk();return}if(page==='apps')return loadApps();if(page==='files'){S.telemetry=await get('/api/telemetry');files();return}if(page==='privacy'){S.privacy=await get('/api/privacy');privacy();return}if(page==='backup')return backup()}
async function loadMonitor(){[S.telemetry,S.battery,S.system,S.processes]=await Promise.all([get('/api/telemetry'),get('/api/battery'),get('/api/system'),get('/api/processes')]);calcNet(S.telemetry);monitor()}
async function loadDevice(){[S.bt,S.usb]=await Promise.all([get('/api/bluetooth'),get('/api/usb')]);device()}
async function loadApps(){S.packages=await get('/api/packages');apps()}
$('#refresh').onclick=()=>loadPage();$('#quick').onclick=()=>toast('Use the left navigation for system controls.');
setInterval(()=>{$('#clock').textContent=new Date().toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit'});if(page==='monitor')loadMonitor()},3500);header();loadPage();
</script></body></html>
